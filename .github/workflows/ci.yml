name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project guidance and retrospective index
        run: pnpm test:project-guidance

      - name: Verify fixed-time governance
        run: pnpm test:time-governance

      - name: Verify API contract freeze
        run: pnpm contracts:check

      - name: Run tests
        run: pnpm test

      - name: Run type checks
        run: pnpm typecheck

      - name: Enforce coverage
        run: pnpm test:coverage

      - name: Validate schemas
        run: pnpm schema:validate

      - name: Install Chromium for browser acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser workflow and visual acceptance
        run: pnpm test:browser

      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
