<!-- @dsCard group="操作" height=110 -->
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--ink-primary)} .lbl{font-size:11px;letter-spacing:.08em;color:var(--ink-tertiary)} .chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-full);font-size:12px;font-weight:600;white-space:nowrap} .fav{background:var(--relation-favorable-bg);color:var(--relation-favorable-fg)} .adv{background:var(--relation-adverse-bg);color:var(--relation-adverse-fg)} .neu{background:var(--relation-neutral-bg);color:var(--relation-neutral-fg)} .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;box-sizing:border-box}</style>
<div style="padding:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <button style="height:40px;padding:0 20px;border:0;border-radius:var(--radius-md);background:var(--accent);color:var(--accent-on);font:inherit;font-size:14px;font-weight:600">复制结论到病历</button>
  <button style="height:40px;padding:0 18px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-card);color:var(--ink-secondary);font:inherit;font-size:13.5px">结束并销毁答卷</button>
  <button style="height:36px;padding:0 12px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--ink-secondary);font:inherit;font-size:13px">上一题</button>
  <button aria-label="收起" style="width:32px;height:32px;border:0;border-radius:var(--radius-sm);background:var(--surface-sunken);color:var(--ink-tertiary);display:inline-flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
</div>
