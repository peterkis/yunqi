<!-- @dsCard group="运气元素" height=96 subtitle="木 火 土 金 水" -->
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--ink-primary)} .lbl{font-size:11px;letter-spacing:.08em;color:var(--ink-tertiary)} .chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-full);font-size:12px;font-weight:600;white-space:nowrap} .fav{background:var(--relation-favorable-bg);color:var(--relation-favorable-fg)} .adv{background:var(--relation-adverse-bg);color:var(--relation-adverse-fg)} .neu{background:var(--relation-neutral-bg);color:var(--relation-neutral-fg)} .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;box-sizing:border-box}</style>
<div style="padding:20px;display:flex;gap:20px;font-size:14px;font-weight:600">
  <span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--element-wood)"></span>木</span>
  <span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--element-fire)"></span>火</span>
  <span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--element-earth)"></span>土</span>
  <span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--element-metal-fill);border:1.5px solid var(--element-metal-ring)"></span>金</span>
  <span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--element-water)"></span>水</span>
</div>
