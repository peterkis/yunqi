<!-- @dsCard group="容器" height=300 subtitle="全年卡" -->
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--ink-primary)} .lbl{font-size:11px;letter-spacing:.08em;color:var(--ink-tertiary)} .chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-full);font-size:12px;font-weight:600;white-space:nowrap} .fav{background:var(--relation-favorable-bg);color:var(--relation-favorable-fg)} .adv{background:var(--relation-adverse-bg);color:var(--relation-adverse-fg)} .neu{background:var(--relation-neutral-bg);color:var(--relation-neutral-fg)} .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;box-sizing:border-box}</style>
<div style="padding:16px;width:368px">
<section style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:18px">
  <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">全年 · 2026</span><span style="font-size:11px;color:var(--ink-tertiary)">大寒 01-20 起</span></div>
  <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px"><span style="font-family:var(--font-serif);font-size:40px;font-weight:700;letter-spacing:.04em;line-height:1">丙午</span><span style="font-size:14px;color:var(--ink-secondary)">水运太过之年</span></div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--border-subtle)">
    <div style="padding-top:12px"><div class="lbl">岁运</div><div style="font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:4px"><span class="dot" style="background:var(--element-water)"></span>水运太过</div></div>
    <div style="padding:12px 0 0 12px;border-left:1px solid var(--border-subtle)"><div class="lbl">司天</div><div style="font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:4px"><span class="dot" style="background:var(--element-fire)"></span>少阴君火</div></div>
    <div style="padding:12px 0 0 12px;border-left:1px solid var(--border-subtle)"><div class="lbl">在泉</div><div style="font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:4px"><span class="dot" style="background:var(--element-metal-fill);border:1.5px solid var(--element-metal-ring)"></span>阳明燥金</div></div>
  </div>
  <div style="margin-top:14px;padding:10px 12px;background:var(--surface-page);border-radius:var(--radius-md);display:flex;gap:10px;align-items:flex-start"><span class="chip adv">不和</span><span style="font-size:12.5px;line-height:1.6;color:var(--ink-secondary)">中运水 克 司天火。用于理解年度结构，不表示个人必然患病。</span></div>
</section>
</div>
