<!-- @dsCard group="量表" height=200 -->
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--ink-primary)} .lbl{font-size:11px;letter-spacing:.08em;color:var(--ink-tertiary)} .chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-full);font-size:12px;font-weight:600;white-space:nowrap} .fav{background:var(--relation-favorable-bg);color:var(--relation-favorable-fg)} .adv{background:var(--relation-adverse-bg);color:var(--relation-adverse-fg)} .neu{background:var(--relation-neutral-bg);color:var(--relation-neutral-fg)} .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;box-sizing:border-box}</style>
<div style="padding:16px;width:368px;display:flex;flex-direction:column;gap:8px">
  <button style="height:48px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--surface-card);display:flex;align-items:center;gap:12px;padding:0 14px;font:inherit;font-size:14px;color:var(--ink-primary);text-align:left"><span style="width:22px;height:22px;border-radius:var(--radius-xs);background:var(--surface-sunken);color:var(--ink-secondary);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">2</span><b style="width:36px">很少</b><span style="color:var(--ink-tertiary);font-size:12.5px">有一点</span></button>
  <button aria-checked="true" role="radio" style="height:48px;border-radius:var(--radius-md);border:1px solid var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-subtle);display:flex;align-items:center;gap:12px;padding:0 14px;font:inherit;font-size:14px;color:var(--ink-primary);text-align:left"><span style="width:22px;height:22px;border-radius:var(--radius-xs);background:var(--accent);color:var(--accent-on);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">3</span><b style="width:36px">有时</b><span style="color:var(--ink-tertiary);font-size:12.5px">有些</span></button>
  <button style="height:48px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--surface-card);display:flex;align-items:center;gap:12px;padding:0 14px;font:inherit;font-size:14px;color:var(--ink-primary);text-align:left"><span style="width:22px;height:22px;border-radius:var(--radius-xs);background:var(--surface-sunken);color:var(--ink-secondary);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">4</span><b style="width:36px">经常</b><span style="color:var(--ink-tertiary);font-size:12.5px">相当</span></button>
</div>
